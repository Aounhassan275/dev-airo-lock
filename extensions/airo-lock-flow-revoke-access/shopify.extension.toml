api_version = "2025-10"

[[extensions]]
name = "Airo Access Lock & Control revoke access"
uid = "8895e7f4-05bb-cfab-f0d7-201018b46e8685fbb805"
type = "flow_action"
handle = "airo-lock-revoke-access"
description = "Removes the access-granting tag for the chosen Airo Access Lock & Control rule from a customer."
runtime_url = "https://dev-lock.airoapps.com/flow/action/revoke-access"

  [settings]

    [[settings.fields]]
    type = "single_line_text_field"
    key = "customerId"
    name = "Customer ID"
    description = "Numeric Shopify customer id to revoke access from."
    required = true

    [[settings.fields]]
    type = "single_line_text_field"
    key = "ruleId"
    name = "Rule ID"
    description = "Internal Airo Access Lock & Control rule id to revoke."
    required = true
